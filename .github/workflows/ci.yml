name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI never pushes; do not leave the job token on disk for later steps.
          persist-credentials: false
          # The secret scan reads every commit of a pull request, not only its final tree.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan, with a negative control
        env:
          SECRETS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/security/scan-secrets.sh

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Migrations already on the base are unchanged
        run: bash scripts/check-migrations-immutable.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: Start the local Supabase stack (applies every migration)
        run: pnpm supabase start

      - name: Write .env
        run: |
          bash scripts/local-env.sh
          cat .env >> "$GITHUB_ENV"

      - name: Schema drift
        run: pnpm db:check-schema

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Vitest (unit, RLS, docs)
        run: pnpm test

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright
        env:
          E2E_PORT: "3100"
        run: pnpm test:e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Build
        run: pnpm build
